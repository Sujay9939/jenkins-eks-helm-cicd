apiVersion: v1

kind: Service

metadata:
  name: {{ include "myapp.fullname" . }}

  labels:
    {{- include "myapp.labels" . | nindent 4 }}

spec:

  type: {{ .Values.service.type }}

  selector:

    app: {{ include "myapp.name" . }}

  ports:

    - name: http

      port: {{ .Values.service.port }}

      targetPort: {{ .Values.service.targetPort }}

      protocol: TCP
